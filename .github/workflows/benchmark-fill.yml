name: Benchmark 15x15 fill
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/**'
      - 'data/reference-grids.json'
      - '.github/workflows/benchmark-fill.yml'
  workflow_dispatch:
    inputs:
      difficulty:
        description: "Provisional answer-vocabulary difficulty"
        required: false
        type: choice
        options: [accessible, standard, challenging]
        default: standard
      seed:
        description: "Grid/random seed"
        required: false
        default: "0"
      min_frequency:
        description: "Minimum English word frequency (Zipf scale)"
        required: false
        default: "3.0"
      grid_trials:
        description: "Different grid layouts to try"
        required: false
        default: "4"
      max_exceptions:
        description: "Target maximum uncommon answers (enforced during quality search)"
        required: false
        default: "5"
      exception_floor:
        description: "Minimum frequency used in quality improvement phase"
        required: false
        default: "2.0"
      grid_strategy:
        description: "Grid selection: ranked or random baseline"
        required: false
        default: "ranked"
      grid_candidates:
        description: "Valid patterns evaluated for each grid trial"
        required: false
        default: "8"
      max_nodes:
        description: "Maximum search nodes"
        required: false
        default: "10000"
permissions:
  contents: read
  pull-requests: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cmudict wordfreq
      - name: Test difficulty profiles
        run: PYTHONPATH=scripts python -m unittest scripts/test_difficulty.py scripts/test_clue_review.py scripts/test_answer_suitability.py scripts/test_vocabulary_grid_rank.py scripts/test_editorial_signals.py scripts/test_grid_editorial_quality.py
      - name: Run benchmark
        env:
          DIFFICULTY: ${{ inputs.difficulty || 'standard' }}
          SEED: ${{ inputs.seed || '0' }}
          GRID_STRATEGY: ${{ inputs.grid_strategy || 'ranked' }}
          GRID_CANDIDATES: ${{ inputs.grid_candidates || '8' }}
          MAX_NODES: ${{ inputs.max_nodes || '10000' }}
          MIN_FREQUENCY: ${{ inputs.min_frequency || '3.0' }}
          GRID_TRIALS: ${{ inputs.grid_trials || '4' }}
          MAX_EXCEPTIONS: ${{ inputs.max_exceptions || '5' }}
          EXCEPTION_FLOOR: ${{ inputs.exception_floor || '2.0' }}
        run: |
          python scripts/benchmark_fill.py \
            --difficulty "$DIFFICULTY" --seed "$SEED" --max-nodes "$MAX_NODES" \
            --min-frequency "$MIN_FREQUENCY" --grid-trials "$GRID_TRIALS" \
            --max-exceptions "$MAX_EXCEPTIONS" --exception-floor "$EXCEPTION_FLOOR" \
            --grid-strategy "$GRID_STRATEGY" --grid-candidates "$GRID_CANDIDATES" \
            --report fill-benchmark.json
      - name: Compare difficulty profiles on identical grid seeds
        run: |
          mkdir -p /tmp/difficulty-comparison
          for level in accessible standard challenging; do
            python scripts/benchmark_fill.py --difficulty "$level" \
              --solver csp --seed 0 --grid-trials 2 --grid-candidates 4 \
              --max-nodes 4000 --report "/tmp/difficulty-comparison/$level.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/difficulty-comparison')
          reports={level:json.loads((out/(level+'.json')).read_text())
                   for level in ('accessible','standard','challenging')}
          lines=['## Matched-seed difficulty comparison','',
                 '| Level | Status | Quality target | Answers | Mean frequency | Exceptions | Grid seed |',
                 '|---|---|---|---:|---:|---:|---:|']
          for level,r in reports.items():
              q=r.get('selected_quality',{})
              draft=r.get('draft',{})
              count=sum(map(len,draft.get('clues',{}).values()))
              seed=next((t.get('selected_grid_seed','—') for t in r['trials']
                         if t['status']=='filled_unreviewed'),'—')
              lines.append(f"| {level} | {r['status']} | {r.get('quality_target_met','—')} | {count} | {q.get('mean_frequency','—')} | {q.get('exception_count','—')} | {seed} |")
          lines+=['','Scores reflect vocabulary popularity, not measured clue difficulty.',
                  'Full unpublished answer lists are attached as a workflow artifact.']
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n'.join(lines)+'\n')
          for level,r in reports.items():
              print('EDITORIAL GRID',level,'selected',r.get('draft',{}).get('grid_editorial_quality'))
              for trial in r['trials']:
                  if trial['status']=='filled_unreviewed':
                      print('EDITORIAL TRIAL',level,
                            'seed',trial.get('selected_grid_seed'),
                            'selected',trial.get('selected'),
                            'baseline_quality',trial.get('baseline_quality'),
                            'improved_quality',trial.get('improved_quality'),
                            'baseline',trial.get('baseline_editorial'),
                            'improved',trial.get('improved_editorial'),
                            'long_variants',trial.get('long_variants'))
          for direction in ('across','down'):
              for clue in reports['accessible'].get('draft',{}).get('clues',{}).get(direction,[]):
                  print('EDITORIAL ANSWER',direction,clue['number'],clue['answer'])
          print('\n'.join(lines))
          if any(r['status']=='filled_unreviewed' and not r.get('quality_target_met',False) for r in reports.values()):
              print('WARNING: At least one completed fill violates its vocabulary target')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: difficulty-comparison-drafts
          path: /tmp/difficulty-comparison/*.json
          if-no-files-found: warn
      - name: Require completed draft meeting vocabulary budget
        run: |
          python -c "import json,sys; r=json.load(open('fill-benchmark.json')); print('Fill:',r['status'],'quality target:',r.get('quality_target_met')); sys.exit(0 if r['status']=='filled_unreviewed' and r.get('quality_target_met') is True else 1)"
      - name: Publish benchmark summary
        if: always()
        run: python scripts/benchmark_summary.py fill-benchmark.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-benchmark
          path: fill-benchmark.json
          if-no-files-found: warn
      - name: Post results on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/post_benchmark_comment.py fill-benchmark.json
