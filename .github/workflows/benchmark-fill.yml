name: Benchmark 15x15 fill
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Grid/random seed"
        required: false
        default: "0"
      min_frequency:
        description: "Minimum English word frequency (Zipf scale)"
        required: false
        default: "3.0"
      grid_trials:
        description: "Different grid layouts to try"
        required: false
        default: "4"
      max_exceptions:
        description: "Target maximum uncommon answers (reported, not enforced)"
        required: false
        default: "5"
      exception_floor:
        description: "Minimum frequency used in quality improvement phase"
        required: false
        default: "2.0"
      max_nodes:
        description: "Maximum search nodes"
        required: false
        default: "10000"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cmudict wordfreq
      - name: Run benchmark (report is uploaded even if fill fails)
        run: python scripts/benchmark_fill.py --seed "${{ inputs.seed }}" --max-nodes "${{ inputs.max_nodes }}" --min-frequency "${{ inputs.min_frequency }}" --grid-trials "${{ inputs.grid_trials }}" --max-exceptions "${{ inputs.max_exceptions }}" --exception-floor "${{ inputs.exception_floor }}" --report fill-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-benchmark
          path: fill-benchmark.json
          if-no-files-found: warn
