name: Benchmark 15x15 fill
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Grid/random seed"
        required: false
        default: "0"
      min_frequency:
        description: "Minimum English word frequency (Zipf scale)"
        required: false
        default: "3.0"
      max_nodes:
        description: "Maximum search nodes"
        required: false
        default: "10000"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cmudict wordfreq
      - name: Run benchmark (report is uploaded even if fill fails)
        run: python scripts/benchmark_fill.py --seed "${{ inputs.seed }}" --max-nodes "${{ inputs.max_nodes }}" --report fill-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-benchmark
          path: fill-benchmark.json
          if-no-files-found: warn
