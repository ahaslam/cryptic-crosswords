name: Benchmark 15x15 fill
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/**'
      - '.github/workflows/benchmark-fill.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: "Grid/random seed"
        required: false
        default: "0"
      min_frequency:
        description: "Minimum English word frequency (Zipf scale)"
        required: false
        default: "3.0"
      grid_trials:
        description: "Different grid layouts to try"
        required: false
        default: "4"
      max_exceptions:
        description: "Target maximum uncommon answers (reported, not enforced)"
        required: false
        default: "5"
      exception_floor:
        description: "Minimum frequency used in quality improvement phase"
        required: false
        default: "2.0"
      grid_strategy:
        description: "Grid selection: ranked or random baseline"
        required: false
        default: "ranked"
      grid_candidates:
        description: "Valid patterns evaluated for each grid trial"
        required: false
        default: "8"
      max_nodes:
        description: "Maximum search nodes"
        required: false
        default: "10000"
permissions:
  contents: read
  pull-requests: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cmudict wordfreq
      - name: Compare 100 generated grids with published references
        run: |
          python scripts/compare_grid_quality.py --samples 100 --output grid-comparison.json
          python -c "import json; r=json.load(open('grid-comparison.json')); print('Reference count:',r['reference_count']); print('Generated count:',r['generated_count']); print('Reference metrics:',r['references']); print('Generated metrics:',r['generated'])"
      - name: Run benchmark
        env:
          SEED: ${{ inputs.seed || '0' }}
          GRID_STRATEGY: ${{ inputs.grid_strategy || 'ranked' }}
          GRID_CANDIDATES: ${{ inputs.grid_candidates || '8' }}
          MAX_NODES: ${{ inputs.max_nodes || '10000' }}
          MIN_FREQUENCY: ${{ inputs.min_frequency || '3.0' }}
          GRID_TRIALS: ${{ inputs.grid_trials || '4' }}
          MAX_EXCEPTIONS: ${{ inputs.max_exceptions || '5' }}
          EXCEPTION_FLOOR: ${{ inputs.exception_floor || '2.0' }}
        run: |
          python scripts/benchmark_fill.py \
            --seed "$SEED" --max-nodes "$MAX_NODES" \
            --min-frequency "$MIN_FREQUENCY" --grid-trials "$GRID_TRIALS" \
            --max-exceptions "$MAX_EXCEPTIONS" --exception-floor "$EXCEPTION_FLOOR" \
            --grid-strategy "$GRID_STRATEGY" --grid-candidates "$GRID_CANDIDATES" \
            --report fill-benchmark.json
      - name: Require completed draft
        run: |
          python -c "import json,sys; report=json.load(open('fill-benchmark.json')); print('Benchmark status:', report['status']); sys.exit(0 if report['status']=='filled_unreviewed' else 1)"
      - name: Publish benchmark summary
        if: always()
        run: python scripts/benchmark_summary.py fill-benchmark.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fill-benchmark
          path: |\n            fill-benchmark.json\n            grid-comparison.json
          if-no-files-found: warn
      - name: Post results on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/post_benchmark_comment.py fill-benchmark.json
